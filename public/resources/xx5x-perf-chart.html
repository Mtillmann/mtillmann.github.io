<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intel CPU — TDP vs Relative Performance</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --color-bg: #171614;
    --color-surface: #1c1b19;
    --color-border: #393836;
    --color-text: #cdccca;
    --color-text-muted: #797876;
    --color-primary: #4f98a3;
    --color-orange: #fdab43;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body), sans-serif;
    padding: 2rem;
    min-height: 100vh;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
    color: var(--color-text);
  }
  p.sub {
    font-size: 0.8rem;
    color: var(--color-text-muted);
    margin-bottom: 1.5rem;
  }
  .chart-wrap {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 0.75rem;
    padding: 1.5rem;
  }
  canvas { width: 100% !important; }
  .legend {
    display: flex;
    gap: 1.5rem;
    margin-top: 1rem;
    font-size: 0.78rem;
    color: var(--color-text-muted);
  }
  .legend span { display: flex; align-items: center; gap: 0.4rem; }
  .dot { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<h1>Intel Socket 775 / 1156 / 1155 / 1150 — TDP vs Relative Performance</h1>
<p class="sub">SPECint2006 base (relative to i3-4170 = 100%) &nbsp;·&nbsp; TDP in watts &nbsp;·&nbsp; chronological order</p>
<div class="chart-wrap">
  <canvas id="chart" height="420"></canvas>
  <div class="legend">
    <span><span class="dot" style="background:#4f98a3"></span> Rel. Performance (%, right axis)</span>
    <span><span class="dot" style="background:#fdab43"></span> TDP (W, left axis)</span>
  </div>
</div>
<script>
const cpus = [
  { label: "P4 540J\nOct'04",   tdp: 84, perf: 15 },
  { label: "C2D E6600\nJul'06", tdp: 65, perf: 32 },
  { label: "PDC E2160\nJun'07", tdp: 65, perf: 27 },
  { label: "PDC E2180\nAug'07", tdp: 65, perf: 28 },
  { label: "C2D E8400\nJan'08", tdp: 65, perf: 49 },
  { label: "Cel E3300\nAug'09", tdp: 65, perf: 33 },
  { label: "i5-750\nSep'09",    tdp: 95, perf: 65 },
  { label: "i3-540\nJan'10",    tdp: 73, perf: 56 },
  { label: "i3-530\nJan'10",    tdp: 73, perf: 54 },
  { label: "P E5500\nApr'10",   tdp: 65, perf: 37 },
  { label: "i5-650\nJan'10",    tdp: 73, perf: 62 },
  { label: "i3-550\nMay'10",    tdp: 73, perf: 59 },
  { label: "i3-2120\nFeb'11",   tdp: 65, perf: 74 },
  { label: "G620\nMay'11",      tdp: 65, perf: 61 },
  { label: "i5-3470s\nJun'12",  tdp: 65, perf: 92 },
  { label: "i5-3330\nSep'12",   tdp: 77, perf: 84 },
  { label: "i3-3245\nJun'13",   tdp: 55, perf: 83 },
  { label: "G2030\nJun'13",     tdp: 55, perf: 74 },
  { label: "G3220\nSep'13",     tdp: 53, perf: 80 },
  { label: "i3-4130\nSep'13",   tdp: 54, perf: 98 },
  { label: "Cel G1820\nJan'14", tdp: 53, perf: 73 },
  { label: "G3250\nJul'14",     tdp: 53, perf: 85 },
  { label: "i3-4170\nMar'15",   tdp: 54, perf: 100 },
];

const labels = cpus.map(c => c.label);
const tdpData = cpus.map(c => c.tdp);
const perfData = cpus.map(c => c.perf);

const ctx = document.getElementById('chart').getContext('2d');
new Chart(ctx, {
  type: 'line',
  data: {
    labels,
    datasets: [
      {
        label: 'TDP (W)',
        data: tdpData,
        yAxisID: 'yLeft',
        borderColor: '#fdab43',
        backgroundColor: 'rgba(253,171,67,0.08)',
        borderWidth: 2,
        pointRadius: 4,
        pointHoverRadius: 6,
        pointBackgroundColor: '#fdab43',
        tension: 0.3,
        fill: true,
      },
      {
        label: 'Rel. Perf (%)',
        data: perfData,
        yAxisID: 'yRight',
        borderColor: '#4f98a3',
        backgroundColor: 'rgba(79,152,163,0.08)',
        borderWidth: 2,
        pointRadius: 4,
        pointHoverRadius: 6,
        pointBackgroundColor: '#4f98a3',
        tension: 0.3,
        fill: true,
      }
    ]
  },
  options: {
    responsive: true,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#1c1b19',
        borderColor: '#393836',
        borderWidth: 1,
        titleColor: '#cdccca',
        bodyColor: '#797876',
        padding: 10,
      }
    },
    scales: {
      x: {
        ticks: {
          color: '#797876',
          font: { size: 10, family: 'Inter' },
          maxRotation: 45,
        },
        grid: { color: 'rgba(255,255,255,0.04)' }
      },
      yLeft: {
        type: 'linear',
        position: 'left',
        title: { display: true, text: 'TDP (W)', color: '#fdab43', font: { size: 11 } },
        ticks: { color: '#fdab43', font: { size: 10 } },
        grid: { color: 'rgba(255,255,255,0.04)' },
        min: 0,
        max: 100,
      },
      yRight: {
        type: 'linear',
        position: 'right',
        title: { display: true, text: 'Rel. Performance (%)', color: '#4f98a3', font: { size: 11 } },
        ticks: { color: '#4f98a3', font: { size: 10 }, callback: v => v + '%' },
        grid: { drawOnChartArea: false },
        min: 0,
        max: 100,
      }
    }
  }
});
</script>
</body>
</html>
